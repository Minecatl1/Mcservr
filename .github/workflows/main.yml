# .github/workflows/docker-loop.yml
name: Long-Running Docker Loop

on:
  workflow_dispatch:   # start the loop manually

# Ensure only one instance runs at a time; queue subsequent runs
concurrency:
  group: docker-loop
  cancel-in-progress: false

jobs:
  run-container:
    runs-on: ubuntu-latest
    timeout-minutes: 180          # 3-hour max per run
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Docker container (max 3 hours)
        run: |
          # Replace with your own image and command.
          # The container must stay alive for up to 3 hours.
          # Example: sleep for exactly 3 hours
          docker run --rm --net=host -e SECRET_KEY=408d9b8653ea47c0e7bdce3e79d4c797fe1ffd79c9d4d5a5cfd45aed6ae3d3b7 ghcr.io/playit-cloud/playit-agent:0.17

  trigger-next:
    needs: run-container
    if: always()                  # run even if the previous job was cancelled (timeout)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the next workflow run
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          gh workflow run "docker-loop.yml" --ref "${{ github.ref_name }}"
